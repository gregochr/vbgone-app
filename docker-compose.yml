# Production stack for the dockermacmini — pulls pre-built GHCR images
# (built by .github/workflows/deploy.yml on a v* tag) instead of building from
# source. Local development uses docker-compose.dev.yml instead.
#
# Deploys are tag-driven: `./release.sh 1.1.0` → the deploy workflow runs
# `docker compose pull && up -d` in /home/<actor>/services/vbgone on the box,
# where a copy of this file + a .env live. See DEPLOY.md.
name: vbgone

services:
  frontend:
    image: ghcr.io/gregochr/vbgone-frontend:latest
    restart: unless-stopped
    ports:
      # host:container — 8086 is free on the Mini; reach via Tailscale/LAN.
      - "8086:3000"
    depends_on:
      - backend

  backend:
    image: ghcr.io/gregochr/vbgone-backend:latest
    restart: unless-stopped
    # No host port — nginx in the frontend proxies /api to backend:8080 internally.
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_MODELS_TOKEN=${GITHUB_MODELS_TOKEN:-}
      # Comma-separated CORS origin patterns; blank falls back to the in-code
      # defaults (which already include the Mini's Tailscale/LAN origins).
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - DOTNET_RUNNER_CONTAINER=vbgone-dotnet-runner
      - JAVA_RUNNER_CONTAINER=vbgone-jdk-maven-runner
    depends_on:
      - dotnet-runner
      - jdk-maven-runner
    volumes:
      - generated-code:/workspace
      # ⚠️ Mounting the host docker socket gives this container root over EVERY
      # container on the Mini. Required for the ProcessBuilder build approach.
      # Do not expose this stack publicly until the security layer is in place.
      - /var/run/docker.sock:/var/run/docker.sock

  dotnet-runner:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: vbgone-dotnet-runner # pinned so the backend can `docker exec` it by name
    restart: unless-stopped
    volumes:
      - generated-code:/workspace
    command: tail -f /dev/null

  jdk-maven-runner:
    image: maven:3.9-eclipse-temurin-21
    container_name: vbgone-jdk-maven-runner # pinned so the backend can `docker exec` it by name
    restart: unless-stopped
    volumes:
      - generated-code:/workspace
      - maven-cache:/root/.m2
    command: tail -f /dev/null

volumes:
  generated-code:
  maven-cache:
