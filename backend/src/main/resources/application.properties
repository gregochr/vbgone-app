spring.application.name=vbgone-app
server.port=8080
anthropic.api.key=${ANTHROPIC_API_KEY:not-set}
github.token=${GITHUB_TOKEN:not-set}
dotnet.runner.container=${DOTNET_RUNNER_CONTAINER:vbgone-app-dotnet-runner-1}
java.runner.container=${JAVA_RUNNER_CONTAINER:vbgone-app-jdk-maven-runner-1}
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB

# Assure Windows runner (Option A) — sends WINDOWS_GATED classes to a GitHub-hosted windows-latest
# runner that builds on net48. The per-run choice is the header RUNNER toggle (defaults to Linux);
# this flag is the estate-wide KILL-SWITCH. Left on: choosing Windows in the UI dispatches; net-ready
# classes always stay on the Linux sidecar. Set false to force every class onto Linux regardless of
# the toggle (e.g. a deployment with no Windows runner). Windows dispatch needs github.token to have
# contents:write + actions:read on the repo below, and the async baseline-tests wrapper (Phase 3).
vbgone.assure.windows-runner.enabled=${ASSURE_WINDOWS_RUNNER_ENABLED:true}
vbgone.assure.windows-runner.repo-owner=${ASSURE_WINDOWS_RUNNER_OWNER:gregochr}
vbgone.assure.windows-runner.repo-name=${ASSURE_WINDOWS_RUNNER_REPO:vbgone-app}
