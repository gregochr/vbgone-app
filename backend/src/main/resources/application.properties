spring.application.name=vbgone-app
server.port=8080
anthropic.api.key=${ANTHROPIC_API_KEY:not-set}
github.token=${GITHUB_TOKEN:not-set}
dotnet.runner.container=${DOTNET_RUNNER_CONTAINER:vbgone-app-dotnet-runner-1}
java.runner.container=${JAVA_RUNNER_CONTAINER:vbgone-app-jdk-maven-runner-1}
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB

# Assure Windows runner (Option A) — routes WINDOWS_GATED classes to a GitHub-hosted windows-latest
# runner that builds on net48. OFF by default: with it disabled every class runs on the Linux
# sidecar, so framework-gated classes ERROR exactly as before. Do NOT enable in production until the
# baseline-tests call is made async (a Windows run takes minutes and would block the HTTP request).
# Requires github.token to have contents:write + actions:read on the repo below.
vbgone.assure.windows-runner.enabled=${ASSURE_WINDOWS_RUNNER_ENABLED:false}
vbgone.assure.windows-runner.repo-owner=${ASSURE_WINDOWS_RUNNER_OWNER:gregochr}
vbgone.assure.windows-runner.repo-name=${ASSURE_WINDOWS_RUNNER_REPO:vbgone-app}
