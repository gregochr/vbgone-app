name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Unit tests only. The *IT.java integration tests are tagged `integration`
      # and excluded by surefire's default excludedGroups; they need the Docker
      # dotnet-runner sidecar and only run under `-Pintegration`. jacoco's report
      # goal is bound to the test phase, so this also produces jacoco.xml.
      - name: Test
        run: ./mvnw -B --no-transfer-progress test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: backend/target/site/jacoco/jacoco.xml
          flags: backend
          fail_ci_if_error: false
