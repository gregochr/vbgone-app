name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Prettier check
        run: npx prettier --check .

      - name: Lint
        run: npx eslint .

      # Full production build (tsc -b + vite build) — the same command the deploy
      # image runs. vitest/eslint don't type-check test files under the build's
      # project references, so without this a type break in a *.test.tsx slips
      # through CI and only fails at image build time (see the v1.2.x deploys).
      - name: Type-check & build
        run: npm run build

      - name: Test with coverage
        run: npx vitest run --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
