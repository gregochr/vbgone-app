name: Deploy

# Tag-triggered. Build images on github-hosted with buildx cache, then deploy
# via docker compose on the self-hosted dockermacmini. Mirrors the gregochr
# fleet convention (see wainwrights). Cut a release with: ./release.sh 1.1.0

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write # push to ghcr.io

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/vbgone-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/vbgone-frontend

jobs:
  build-images:
    name: Build & push images (github-hosted)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag → version
        id: vars
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.vars.outputs.version }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          # ignore-error: a transient GHA cache export hiccup must not fail the
          # release — the image is already built and pushed by then.
          cache-to: type=gha,scope=backend,mode=max,ignore-error=true

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.vars.outputs.version }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max,ignore-error=true

  deploy:
    name: Pull & restart (self-hosted dockermacmini)
    needs: build-images
    runs-on: [self-hosted, dockermacmini]
    steps:
      # The images are private, so the pull needs a credential. This job had
      # none: it leaned on the one a human cached in ~/.docker/config.json by
      # running `docker login` on dockermacmini once (see DEPLOY.md). That
      # file was emptied to {"auths":{}} on 2026-07-29 — not an expired
      # token, which would have left its entry behind, but a removed one.
      # Nothing on the box logs out automatically, so it was almost certainly
      # a hand-run `docker logout`.
      #
      # Wainwrights died on the resulting "error from registry: unauthorized"
      # at v0.17.6. This deploy has the identical shape and has simply not
      # been tagged since 15 July, so it is waiting to fail the same way.
      #
      # A credential no job owns is a credential no job can be sure of.
      # GITHUB_TOKEN is minted per run and already carries packages: write
      # from the workflow-level permissions block, so the deploy can
      # authenticate itself and depend on nothing kept by hand.
      #
      # Note the action's post-step runs `docker logout ghcr.io`, so this job
      # leaves auths empty rather than merely finding it that way. That is
      # fine now that wainwrights logs in for itself too — but anything else
      # here pulling from GHCR needs its own login, not a shared cached one.
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: docker compose pull && up -d
        # A copy of docker-compose.yml + a .env live here on the box (one-time
        # setup — see DEPLOY.md). Brings up frontend, backend, and the .NET
        # sidecar; --remove-orphans keeps the stack clean across renames.
        working-directory: /home/${{ github.actor }}/services/vbgone
        run: |
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
