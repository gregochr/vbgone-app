name: Deploy

# Tag-triggered. Build images on github-hosted with buildx cache, then deploy
# via docker compose on the self-hosted dockermacmini. Mirrors the gregochr
# fleet convention (see wainwrights). Cut a release with: ./release.sh 1.1.0

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write # push to ghcr.io

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/vbgone-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/vbgone-frontend

jobs:
  build-images:
    name: Build & push images (github-hosted)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag → version
        id: vars
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.vars.outputs.version }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          # ignore-error: a transient GHA cache export hiccup must not fail the
          # release — the image is already built and pushed by then.
          cache-to: type=gha,scope=backend,mode=max,ignore-error=true

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.vars.outputs.version }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max,ignore-error=true

  deploy:
    name: Pull & restart (self-hosted dockermacmini)
    needs: build-images
    runs-on: [self-hosted, dockermacmini]
    steps:
      - name: docker compose pull && up -d
        # A copy of docker-compose.yml + a .env live here on the box (one-time
        # setup — see DEPLOY.md). Brings up frontend, backend, and the .NET
        # sidecar; --remove-orphans keeps the stack clean across renames.
        working-directory: /home/${{ github.actor }}/services/vbgone
        run: |
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
