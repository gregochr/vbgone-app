# Production stack for the dockermacmini — pulls pre-built GHCR images
# (built by .github/workflows/release-images.yml) instead of building from source.
#
# Deploy:  docker compose -f docker-compose.prod.yml --env-file .env pull
#          docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# See DEPLOY.md for the full runbook.
name: vbgone

services:
  frontend:
    image: ghcr.io/gregochr/vbgone-frontend:latest
    restart: unless-stopped
    ports:
      # host:container — 8086 is free on the Mini; reach via Tailscale/LAN.
      - "8086:3000"
    depends_on:
      - backend

  backend:
    image: ghcr.io/gregochr/vbgone-backend:latest
    restart: unless-stopped
    # No host port — nginx in the frontend proxies /api to backend:8080 internally.
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_MODELS_TOKEN=${GITHUB_MODELS_TOKEN:-}
      - DOTNET_RUNNER_CONTAINER=vbgone-dotnet-runner
    depends_on:
      - dotnet-runner
    volumes:
      - generated-code:/workspace
      # ⚠️ Mounting the host docker socket gives this container root over EVERY
      # container on the Mini. Required for the ProcessBuilder build approach.
      # Do not expose this stack publicly until the security layer is in place.
      - /var/run/docker.sock:/var/run/docker.sock

  dotnet-runner:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: vbgone-dotnet-runner # pinned so the backend can `docker exec` it by name
    restart: unless-stopped
    volumes:
      - generated-code:/workspace
    command: tail -f /dev/null

volumes:
  generated-code:
