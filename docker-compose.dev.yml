services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_MODELS_TOKEN=${GITHUB_MODELS_TOKEN:-}
      - DOTNET_RUNNER_CONTAINER=${DOTNET_RUNNER_CONTAINER:-vbgone-app-dotnet-runner-1}
      - JAVA_RUNNER_CONTAINER=${JAVA_RUNNER_CONTAINER:-vbgone-app-jdk-maven-runner-1}
    depends_on:
      - dotnet-runner
      - jdk-maven-runner
    volumes:
      - generated-code:/workspace
      - /var/run/docker.sock:/var/run/docker.sock

  dotnet-runner:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    volumes:
      - generated-code:/workspace
    command: tail -f /dev/null

  jdk-maven-runner:
    image: maven:3.9-eclipse-temurin-21
    volumes:
      - generated-code:/workspace
      - maven-cache:/root/.m2
    command: tail -f /dev/null

volumes:
  generated-code:
  maven-cache:
